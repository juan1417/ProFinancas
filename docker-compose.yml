version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: profinanzas
      POSTGRES_USER: profinanzas
      POSTGRES_PASSWORD: profinanzas
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profinanzas"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: ProFinanzas.settings
      SECRET_KEY: "change-me-in-production"
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DB_NAME: profinanzas
      DB_USER: profinanzas
      DB_PASSWORD: profinanzas
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./back:/app/back

volumes:
  pgdata:
